name: Bug report
description: Something does not work as expected in the FastAPI backend.
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior, including the exact error message or HTTP status code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Send request to endpoint...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [auth, api, database, migrations, cron-worker, matching-engine, stripe, infra]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "AWS EC2 / Local Docker / Local Python 3.14"
