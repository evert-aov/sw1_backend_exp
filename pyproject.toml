[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "venv", "build"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
